<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
        }
        .story-author-header {
            font-size: 14px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000000);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 4px;
        }
        .community-header {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .progress-bars {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: -4px;
            margin-bottom: 4px;
        }
        .bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            transition: background-color 0.4s ease;
        }
        .bar.active {
            background-color: #28a745;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #e0e0e0;
            color: #555;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .stories-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        .story-card {
            background: #ffffff;
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #2481cc;
        }
        .story-card:hover {
            background: #e9ecef;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .donation-box {
            background: #fff9e6;
            border: 1px solid #ffe0b2;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .donation-text {
            font-size: 13px;
            font-style: italic;
            color: #5c3c10;
            line-height: 1.4;
            padding: 0 8px;
        }
        .btn-channel {
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(36, 129, 204, 0.35);
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Panel Superior: Título/Autor y Promedios Comunitarios -->
        <div class="stats-box" id="stats-panel">
            <div id="story-title-author" class="story-author-header">Cargando historia...</div>
            <div class="community-header">Promedio Global de la Comunidad</div>
            <div class="stats-grid">
                <div><span id="lbl-attr1">Attr 1</span>: <span id="comm-attr1">50</span>%</div>
                <div><span id="lbl-attr2">Attr 2</span>: <span id="comm-attr2">50</span>%</div>
                <div><span id="lbl-attr3">Attr 3</span>: <span id="comm-attr3">50</span>%</div>
                <div><span id="lbl-attr4">Attr 4</span>: <span id="comm-attr4">50</span>%</div>
            </div>
        </div>

        <!-- Imagen de la escena -->
        <img id="imagen" alt="Escena" referrerpolicy="no-referrer">
        
        <!-- Barritas de Progreso Dinámicas -->
        <div class="progress-bars" id="progress-bars-container"></div>

        <!-- Título condicional del capítulo/sección -->
        <div id="titulo" class="title" style="display: none;"></div>
        <!-- Descripción de la escena -->
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <!-- Contenedor dinámico de opciones -->
        <div id="opciones-container" class="options-container"></div>

        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>

        <!-- Selector de otras historias al terminar -->
        <div id="otras-historias" class="stories-box">
            <h3>Otras Historias Disponibles</h3>
            <div id="lista-historias"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        let historiaActualId = 'mansion_misterio';
        let capituloActualId = 'cap_1';
        let totalPasosHistoria = 3; 
        let pasoActualIndex = 0; 

        let nombresAtributos = {
            attr1: 'Atributo 1',
            attr2: 'Atributo 2',
            attr3: 'Atributo 3',
            attr4: 'Atributo 4'
        };

        let jugador = {
            attr1: 50,
            attr2: 50,
            attr3: 50,
            attr4: 50
        };

        function ajustarEscala(actual, delta) {
            return Math.min(100, Math.max(0, actual + delta));
        }

        function barajarArreglo(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function obtenerIndicePorIdCapitulo(idCap) {
            if (idCap === 'fin') return totalPasosHistoria - 1;
            const match = idCap.match(/\d+/);
            if (match) {
                const num = parseInt(match[0], 10);
                return Math.min(totalPasosHistoria - 1, Math.max(0, num - 1));
            }
            return pasoActualIndex;
        }

        function actualizarBarritasProgreso() {
            const contenedor = document.getElementById('progress-bars-container');
            let htmlBarritas = '';
            
            for (let i = 0; i < totalPasosHistoria; i++) {
                let claseActiva = i <= pasoActualIndex ? 'bar active' : 'bar';
                htmlBarritas += `<div class="${claseActiva}"></div>`;
            }
            
            contenedor.innerHTML = htmlBarritas;
        }

        async function cargarConfiguracionHistoria(hId) {
            const { data } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('historia_id', hId)
                .maybeSingle();

            if (data) {
                nombresAtributos.attr1 = data.attr_1_nombre;
                nombresAtributos.attr2 = data.attr_2_nombre;
                nombresAtributos.attr3 = data.attr_3_nombre;
                nombresAtributos.attr4 = data.attr_4_nombre;
                totalPasosHistoria = data.total_pasos || 3;

                document.getElementById('lbl-attr1').innerText = data.attr_1_nombre;
                document.getElementById('lbl-attr2').innerText = data.attr_2_nombre;
                document.getElementById('lbl-attr3').innerText = data.attr_3_nombre;
                document.getElementById('lbl-attr4').innerText = data.attr_4_nombre;

                const autor = data.autor || 'G.J. Santos';
                document.getElementById('story-title-author').innerText = `${data.titulo_historia} – ${autor}`;
            }
        }

        async function actualizarEstadisticasComunidad() {
            const { data } = await supabaseClient
                .from('promedios_globales')
                .select('*')
                .eq('historia_id', historiaActualId)
                .maybeSingle();

            if (!data || data.total_partidas === 0) {
                document.getElementById('comm-attr1').innerText = '50';
                document.getElementById('comm-attr2').innerText = '50';
                document.getElementById('comm-attr3').innerText = '50';
                document.getElementById('comm-attr4').innerText = '50';
                return;
            }

            document.getElementById('comm-attr1').innerText = Math.round(data.attr1_acum / data.total_partidas);
            document.getElementById('comm-attr2').innerText = Math.round(data.attr2_acum / data.total_partidas);
            document.getElementById('comm-attr3').innerText = Math.round(data.attr3_acum / data.total_partidas);
            document.getElementById('comm-attr4').innerText = Math.round(data.attr4_acum / data.total_partidas);
        }

        async function registrarPuntajeFinalComunidad() {
            const { data: actual } = await supabaseClient
                .from('promedios_globales')
                .select('*')
                .eq('historia_id', historiaActualId)
                .maybeSingle();

            let nuevoTotal = (actual ? actual.total_partidas : 0) + 1;
            let nuevo1 = (actual ? actual.attr1_acum : 0) + jugador.attr1;
            let nuevo2 = (actual ? actual.attr2_acum : 0) + jugador.attr2;
            let nuevo3 = (actual ? actual.attr3_acum : 0) + jugador.attr3;
            let nuevo4 = (actual ? actual.attr4_acum : 0) + jugador.attr4;

            await supabaseClient
                .from('promedios_globales')
                .update({
                    total_partidas: nuevoTotal,
                    attr1_acum: nuevo1,
                    attr2_acum: nuevo2,
                    attr3_acum: nuevo3,
                    attr4_acum: nuevo4
                })
                .eq('historia_id', historiaActualId);
        }

        async function iniciarApp() {
            const telegramUser = tg.initDataUnsafe?.user;
            if (!telegramUser || !telegramUser.id) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram para jugar.</p>
                    </div>
                `;
                return;
            }

            const { data: historiaActiva } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('activa', true)
                .limit(1)
                .maybeSingle();

            if (historiaActiva) {
                historiaActualId = historiaActiva.historia_id;
            }

            pasoActualIndex = 0;
            await cargarConfiguracionHistoria(historiaActualId);
            await actualizarEstadisticasComunidad();
            cargarCapitulo(capituloActualId);
        }

        setTimeout(iniciarApp, 500);

        async function cargarCapitulo(idCapitulo) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('otras-historias').style.display = 'none';
            
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();
            actualizarBarritasProgreso();

            const { data: capituloData, error } = await supabaseClient
                .from('capitulos')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('id', idCapitulo)
                .maybeSingle();

            if (error || !capituloData || idCapitulo === 'fin') {
                pasoActualIndex = totalPasosHistoria - 1;
                actualizarBarritasProgreso();

                await registrarPuntajeFinalComunidad();
                await actualizarEstadisticasComunidad();

                // Ocultar el título de capítulo al finalizar la historia
                document.getElementById('titulo').style.display = 'none';

                // Consultar epílogos desde Supabase y buscar el que cumpla con los porcentajes del jugador
                const { data: listaEpilogos } = await supabaseClient
                    .from('epilogos')
                    .select('*')
                    .eq('historia_id', historiaActualId);

                let epilogoEncontrado = null;
                if (listaEpilogos && listaEpilogos.length > 0) {
                    epilogoEncontrado = listaEpilogos.find(ep => {
                        const c1 = (ep.min_attr1 === null || jugador.attr1 >= ep.min_attr1) && (ep.max_attr1 === null || jugador.attr1 <= ep.max_attr1);
                        const c2 = (ep.min_attr2 === null || jugador.attr2 >= ep.min_attr2) && (ep.max_attr2 === null || jugador.attr2 <= ep.max_attr2);
                        const c3 = (ep.min_attr3 === null || jugador.attr3 >= ep.min_attr3) && (ep.max_attr3 === null || jugador.attr3 <= ep.max_attr3);
                        const c4 = (ep.min_attr4 === null || jugador.attr4 >= ep.min_attr4) && (ep.max_attr4 === null || jugador.attr4 <= ep.max_attr4);
                        return c1 && c2 && c3 && c4;
                    });
                }

                let tituloFinal = epilogoEncontrado ? epilogoEncontrado.titulo_conclusion : 'EPÍLOGO Y CONCLUSIÓN';
                let textoFinal = epilogoEncontrado ? epilogoEncontrado.texto_epilogo : 'Has completado la historia.';

                // Reemplazo dinámico de los cuatro atributos ({attrX_nombre} y {attrX_val})
                textoFinal = textoFinal
                    .replaceAll('{attr1_nombre}', nombresAtributos.attr1)
                    .replaceAll('{attr1_val}', jugador.attr1)
                    .replaceAll('{attr2_nombre}', nombresAtributos.attr2)
                    .replaceAll('{attr2_val}', jugador.attr2)
                    .replaceAll('{attr3_nombre}', nombresAtributos.attr3)
                    .replaceAll('{attr3_val}', jugador.attr3)
                    .replaceAll('{attr4_nombre}', nombresAtributos.attr4)
                    .replaceAll('{attr4_val}', jugador.attr4);

                tituloFinal = tituloFinal
                    .replaceAll('{attr1_nombre}', nombresAtributos.attr1)
                    .replaceAll('{attr2_nombre}', nombresAtributos.attr2)
                    .replaceAll('{attr3_nombre}', nombresAtributos.attr3)
                    .replaceAll('{attr4_nombre}', nombresAtributos.attr4);

                document.getElementById('pregunta').innerHTML = `
                    <strong>${tituloFinal}</strong><br><br>
                    <p style="text-align: justify; font-size: 14px; line-height: 1.5;">${textoFinal}</p><br>
                    
                    <strong>Resultado Individual:</strong><br>
                    ${nombresAtributos.attr1}: ${jugador.attr1}% | ${nombresAtributos.attr2}: ${jugador.attr2}%<br>
                    ${nombresAtributos.attr3}: ${jugador.attr3}% | ${nombresAtributos.attr4}: ${jugador.attr4}%
                    
                    <div class="donation-box">
                        <div class="donation-text">
                            Mantener este espacio vivo requiere tiempo y recursos. Apóyanos ahora mismo enviando un regalo a nuestro canal.
                        </div>
                        <button class="btn-channel" onclick="abrirCanalRegalos()">Enviar Regalo</button>
                    </div>
                `;
                
                document.getElementById('opciones-container').innerHTML = '';
                document.getElementById('progress-bars-container').style.display = 'none';
                
                mostrarOtrasHistorias();
                return;
            }

            // Validar si la celda del título de la sección/capítulo tiene contenido en Supabase
            const elementoTitulo = document.getElementById('titulo');
            if (capituloData.titulo && capituloData.titulo.trim() !== '') {
                elementoTitulo.innerText = capituloData.titulo;
                elementoTitulo.style.display = 'block';
            } else {
                elementoTitulo.innerText = '';
                elementoTitulo.style.display = 'none';
            }

            // Mostrar la descripción de la escena
            document.getElementById('pregunta').innerText = capituloData.descripcion;

            const { data: opcionesList } = await supabaseClient
                .from('opciones')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('capitulo_id', idCapitulo);

            const contenedorOpciones = document.getElementById('opciones-container');
            contenedorOpciones.innerHTML = '';

            if (opcionesList && opcionesList.length > 0) {
                const opcionesAleatorias = barajarArreglo(opcionesList);

                opcionesAleatorias.forEach((opcion) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.dataset.opcionId = opcion.id; 
                    btn.innerText = opcion.texto_opcion;
                    btn.onclick = () => procesarSeleccionOpcion(opcion, opcionesList);
                    contenedorOpciones.appendChild(btn);
                });
            }
        }

        function abrirCanalRegalos() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const urlCanal = 'https://t.me/BookBetaReader';

            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(urlCanal);
            } else {
                window.open(urlCanal, '_blank');
            }
        }

        async function procesarSeleccionOpcion(opcionElegida, opcionesList) {
            const botones = document.querySelectorAll('#opciones-container .btn');
            botones.forEach(b => b.disabled = true);

            jugador.attr1 = ajustarEscala(jugador.attr1, opcionElegida.attr1_delta || 0);
            jugador.attr2 = ajustarEscala(jugador.attr2, opcionElegida.attr2_delta || 0);
            jugador.attr3 = ajustarEscala(jugador.attr3, opcionElegida.attr3_delta || 0);
            jugador.attr4 = ajustarEscala(jugador.attr4, opcionElegida.attr4_delta || 0);

            const nuevoConteo = (opcionElegida.votos_contador || 0) + 1;
            await supabaseClient
                .from('opciones')
                .update({ votos_contador: nuevoConteo })
                .eq('id', opcionElegida.id);

            const { data: opcionesActualizadas } = await supabaseClient
                .from('opciones')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('capitulo_id', capituloActualId);

            let totalVotosCapitulo = 0;
            if (opcionesActualizadas) {
                opcionesActualizadas.forEach(o => {
                    totalVotosCapitulo += (o.votos_contador || 0);
                });
            }

            botones.forEach(btn => {
                const optId = btn.dataset.opcionId;
                const optData = opcionesActualizadas.find(o => o.id.toString() === optId);
                
                const votosEstaOpc = optData ? (optData.votos_contador || 0) : 0;
                const porcentaje = totalVotosCapitulo > 0 ? Math.round((votosEstaOpc / totalVotosCapitulo) * 100) : 0;
                const optOriginal = opcionesList.find(o => o.id.toString() === optId);

                btn.innerHTML = `${optOriginal.texto_opcion}<br><span style="font-size: 13px; font-weight: normal;">${porcentaje}% (${votosEstaOpc} votos)</span>`;
            });

            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                pasoActualIndex = obtenerIndicePorIdCapitulo(opcionElegida.siguiente_capitulo);
                capituloActualId = opcionElegida.siguiente_capitulo;
                cargarCapitulo(capituloActualId);
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        async function mostrarOtrasHistorias() {
            const { data: lista } = await supabaseClient
                .from('config_historia')
                .select('*');

            if (!lista || lista.length <= 1) return;

            const contenedorLista = document.getElementById('lista-historias');
            contenedorLista.innerHTML = '';

            lista.forEach(h => {
                if (h.historia_id !== historiaActualId) {
                    const card = document.createElement('div');
                    card.className = 'story-card';
                    card.innerText = h.titulo_historia;
                    card.onclick = async () => {
                        historiaActualId = h.historia_id;
                        capituloActualId = 'cap_1';
                        pasoActualIndex = 0; 
                        jugador = { attr1: 50, attr2: 50, attr3: 50, attr4: 50 };
                        document.getElementById('progress-bars-container').style.display = 'flex';
                        
                        await cargarConfiguracionHistoria(historiaActualId);
                        cargarCapitulo(capituloActualId);
                    };
                    contenedorLista.appendChild(card);
                }
            });

            document.getElementById('otras-historias').style.display = 'block';
        }
    </script>
</body>
</html>
