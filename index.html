<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Reads</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }
        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-arrow {
            background: none;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #2481cc);
            cursor: pointer;
            padding: 0 8px;
            user-select: none;
            transition: opacity 0.2s;
        }
        .nav-arrow:hover {
            opacity: 0.7;
        }
        .music-nav-arrow {
            background: none;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000000);
            cursor: pointer;
            padding: 0 4px;
            user-select: none;
            transition: opacity 0.2s;
        }
        .music-nav-arrow:hover {
            opacity: 0.7;
        }
        .story-author-header {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            color: var(--tg-theme-text-color, #000000);
        }
        .author-name {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .stars-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 15px;
            font-weight: bold;
        }
        .stars-display {
            color: #ffc107;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .rating-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .interactive-stars {
            font-size: 28px;
            color: #ccc;
            cursor: pointer;
            letter-spacing: 4px;
            user-select: none;
        }
        .interactive-stars span {
            transition: color 0.2s;
        }
        .interactive-stars span:hover,
        .interactive-stars span.active {
            color: #ffc107;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .progress-bars {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: -4px;
            margin-bottom: 4px;
        }
        .bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            transition: background-color 0.4s ease;
        }
        .bar.active {
            background-color: #28a745;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            margin-bottom: 2px;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .instruction-hint {
            font-style: italic;
            text-align: center;
            font-size: 14px;
            margin-top: 4px;
            color: var(--tg-theme-hint-color, #707579);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #e0e0e0;
            color: #555;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .stories-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        .search-section-footer {
            margin-top: 14px;
            padding-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }
        .search-input {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #ffffff;
            color: #000;
        }
        .search-input::placeholder {
            color: #888;
            font-style: italic;
        }
        .search-input:focus {
            border-color: #2481cc;
        }
        .search-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .search-results {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .search-result-item {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-result-item:hover {
            background: #e9ecef;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .donation-box {
            background: #fff9e6;
            border: 1px solid #ffe0b2;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .donation-text {
            font-size: 13px;
            font-style: italic;
            color: #5c3c10;
            line-height: 1.4;
            padding: 0 8px;
        }
        .btn-channel {
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(36, 129, 204, 0.35);
        }
        .btn-share {
            background-color: #17a2b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Panel Superior -->
        <div class="stats-box" id="stats-panel">
            <button class="nav-arrow" onclick="cambiarHistoriaAdyacente(-1)">&#10094;</button>
            <div class="stats-center">
                <div id="story-title-author" class="story-author-header">Cargando datos</div>
                <div class="stars-container">
                    <span id="avg-rating-num">0.0</span>
                    <span class="stars-display" id="avg-stars-icon">★★★★★</span>
                    <span id="total-ratings-count">(0)</span>
                </div>
                <div id="story-author-name" class="author-name">Autor: Cargando...</div>
            </div>
            <button class="nav-arrow" onclick="cambiarHistoriaAdyacente(1)">&#10095;</button>
        </div>
        <!-- Reproductor de Música Ambiental -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin: 5px 0;">
            <audio id="bg-music" preload="none" loop></audio>
            <button class="music-nav-arrow" onclick="cambiarPistaManual(-1)">&#171;</button>
            <button class="btn" style="padding: 10px 14px; font-size: 13px; width: auto; border-radius: 8px;" onclick="toggleMusicaAleatoria()">
            🎵 <span id="music-text">Música Ambiental: Off</span>
            </button>
            <button class="music-nav-arrow" onclick="cambiarPistaManual(1)">&#187;</button>
        </div>
        <!-- Imagen de la escena -->
        <img id="imagen" alt="Escena" referrerpolicy="no-referrer">
        <!-- Barritas de Progreso Dinámicas -->
        <div class="progress-bars" id="progress-bars-container"></div>
        <!-- Título condicional del capítulo/sección -->
        <div id="titulo" class="title" style="display: none;"></div>
        <!-- Descripción de la escena -->
        <div id="pregunta" class="question">Por favor, espera...</div>
        <!-- Contenedor dinámico de opciones -->
        <div id="opciones-container" class="options-container"></div>
        <!-- Texto agregado debajo de las opciones -->
        <div id="hint-siguiente" class="instruction-hint">¡Elige una opción y presiona siguiente!</div>
        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>
        <!-- Bloque final exclusivo para buscador y opciones de fin -->
        <div id="otras-historias" class="stories-box">
            <div class="search-section-footer">
                <div class="search-input-group">
                    <input type="text" id="input-busqueda" class="search-input" placeholder="Buscar libro o autor...">
                    <button class="search-btn" onclick="buscarHistoriaSupabase()">Buscar</button>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });
        const tg = window.Telegram.WebApp;
        tg.expand();
        let historiaActualId = '';
        let capituloActualId = 'cap_1';
        let totalPasosHistoria = 3;
        let pasoActualIndex = 0;
        let autorActualNombre = '';
        const listaMusica = [
            "audio/11145955-mesa-10550.mp3",
            "audio/40173586-magic-forest-473582.mp3",
            "audio/amarantamusic-i-give-you-my-heart-109346.mp3",
            "audio/koto-japan-soundtrack-anime-background-japanese-aikoto-10-470649.mp3",
            "audio/leberch-fear-525004.mp3",
            "audio/leberch-reading-books-590361.mp3",
            "audio/pianocafe_kumi-japanese-piano-568759.mp3",
            "audio/renilsonb-fjord-nordic-545826.mp3",
            "audio/the_mountain-suspense-cyberpunk-375986.mp3",
            "audio/theojt-dark-ambient-121126.mp3"
        ];
        let indicePistaActual = listaMusica.indexOf("audio/leberch-reading-books-590361.mp3");
        if (indicePistaActual === -1) indicePistaActual = 0;
        function reproducirPistaPredeterminada() {
            const audio = document.getElementById('bg-music');
            if (listaMusica.length > 0) {
                audio.src = listaMusica[indicePistaActual];
                audio.loop = true;
                audio.load();
                audio.play().catch(err => console.log("Error al reproducir pista predeterminada:", err));
            }
        }
        function cambiarPistaManual(direccion) {
            const audio = document.getElementById('bg-music');
            const text = document.getElementById('music-text');
            if (listaMusica.length === 0) return;
            indicePistaActual = (indicePistaActual + direccion + listaMusica.length) % listaMusica.length;
            audio.src = listaMusica[indicePistaActual];
            audio.loop = true;
            audio.load();
            audio.play().then(() => {
                text.innerText = "Música Ambiental: On";
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            }).catch(err => console.log("Error al cambiar pista manualmente:", err));
        }
        function toggleMusicaAleatoria() {
            const audio = document.getElementById('bg-music');
            const text = document.getElementById('music-text');
            if (audio.paused) {
                if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                    reproducirPistaPredeterminada();
                } else {
                    audio.play().catch(err => console.log("Error al reproducir audio:", err));
                }
                text.innerText = "Música Ambiental: On";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                audio.pause();
                text.innerText = "Música Ambiental: Off";
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            }
        }
        function limpiarBuscador() {
            const input = document.getElementById('input-busqueda');
            const resultados = document.getElementById('search-results');
            if (input) input.value = '';
            if (resultados) resultados.innerHTML = '';
        }
        async function buscarHistoriaSupabase() {
            const texto = document.getElementById('input-busqueda').value.trim();
            const contenedorResultados = document.getElementById('search-results');
            contenedorResultados.innerHTML = '';
            if (!texto) {
                contenedorResultados.innerHTML = `<div style="text-align: center; color: #666; font-size: 12px; padding: 4px;">Escribe el nombre de un libro o autor.</div>`;
                return;
            }
            const { data, error } = await supabaseClient
                .from('config_historia')
                .select('historia_id, titulo_historia, autor')
                .eq('estado', 'publico')
                .or(`titulo_historia.ilike.%${texto}%,autor.ilike.%${texto}%`)
                .limit(5);
            if (error) {
                console.error("Error en búsqueda:", error);
                contenedorResultados.innerHTML = `<div style="text-align: center; color: #d9534f; font-size: 12px; padding: 4px;">Ocurrió un error al realizar la búsqueda.</div>`;
                return;
            }
            if (data && data.length > 0) {
                data.forEach(libro => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold; color: #2481cc;">${libro.titulo_historia}</div>
                            <div style="font-size: 11px; color: #666;">Autor: ${libro.autor || 'Desconocido'}</div>
                        </div>
                        <span style="font-size: 12px; font-weight: bold; color: #28a745;">Leer ➔</span>
                    `;
                    item.onclick = async () => {
                        historiaActualId = libro.historia_id;
                        capituloActualId = 'cap_1';
                        pasoActualIndex = 0;
                        limpiarBuscador();
                        document.getElementById('otras-historias').style.display = 'none';
                        document.getElementById('progress-bars-container').style.display = 'flex';
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        const historiaCargada = await cargarConfiguracionHistoria(historiaActualId);
                        await cargarCapitulo(capituloActualId, historiaCargada && historiaCargada.cap_1);
                    };
                    contenedorResultados.appendChild(item);
                });
            } else {
                contenedorResultados.innerHTML = `<div style="text-align: center; color: #856404; font-size: 12px; padding: 8px; background: #fff3cd; border-radius: 6px;">No encontramos este título o autor. ¡Pronto podríamos agregarlo!</div>`;
            }
        }
        function verificarParametroHistoria() {
            const params = new URLSearchParams(window.location.search);
            let historiaParam = params.get('historia') || params.get('startapp');
            if (!historiaParam && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                historiaParam = tg.initDataUnsafe.start_param;
            }
            if (historiaParam) {
                historiaActualId = historiaParam;
            }
        }
        function barajarArreglo(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function obtenerIndicePorIdCapitulo(idCap) {
            if (idCap === 'fin' || idCap.includes('epilogo')) return totalPasosHistoria - 1;
            const match = idCap.match(/\d+/);
            if (match) {
                const num = parseInt(match[0], 10);
                return Math.min(totalPasosHistoria - 1, Math.max(0, num - 1));
            }
            return pasoActualIndex;
        }
        function actualizarBarritasProgreso() {
            const contenedor = document.getElementById('progress-bars-container');
            let htmlBarritas = '';
            for (let i = 0; i < totalPasosHistoria; i++) {
                let claseActiva = i <= pasoActualIndex ? 'bar active' : 'bar';
                htmlBarritas += `<div class="${claseActiva}"></div>`;
            }
            contenedor.innerHTML = htmlBarritas;
        }
        // SELECCIÓN ALEATORIA ULTRALIGERA: UNA sola petición a la base (función obtener_historia_aleatoria).
        // Devuelve solo la historia elegida (título, autor, total de capítulos, estrellas y capítulo 1).
        // Nunca se descarga la lista de historias, sin importar cuántas existan.
        async function cambiarHistoriaAdyacente(direccion) {
            if (cambiarHistoriaAdyacente.enCurso) return; // evita clics solapados
            cambiarHistoriaAdyacente.enCurso = true;
            try {
                limpiarBuscador();
                const { data, error } = await supabaseClient
                    .rpc('obtener_historia_aleatoria', { p_excluir: historiaActualId || null });
                if (error || !data) return; // no hay otra historia a la que ir

                historiaActualId = data.historia_id;
                capituloActualId = 'cap_1';
                pasoActualIndex = 0;
                document.getElementById('progress-bars-container').style.display = 'flex';

                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

                aplicarConfigHistoria(data);
                await cargarCapitulo(capituloActualId, data.cap_1);
            } finally {
                cambiarHistoriaAdyacente.enCurso = false;
            }
        }

        // Pinta título, autor, total de capítulos y estrellas con los datos que ya trae la historia
        function aplicarConfigHistoria(h) {
            autorActualNombre = h.autor || 'Desconocido';
            if (h.total_capitulos && h.total_capitulos > 0) {
                totalPasosHistoria = h.total_capitulos;
            }
            document.getElementById('story-title-author').innerText = h.titulo_historia;
            document.getElementById('story-author-name').innerText = `Autor: ${autorActualNombre}`;
            pintarEstadisticas(h.votos, h.suma);
        }

        // UNA sola petición: configuración + estadísticas + capítulo 1 de una historia concreta
        async function cargarConfiguracionHistoria(hId) {
            const { data, error } = await supabaseClient
                .rpc('obtener_historia', { p_historia: hId });
            if (error || !data) return null;
            aplicarConfigHistoria(data);
            return data;
        }

        function pintarEstadisticas(votos, suma) {
            let totalVotos = votos || 0;
            let sumaEstrellas = suma || 0;
            let promedio = totalVotos > 0 ? (sumaEstrellas / totalVotos).toFixed(1) : '0.0';
            document.getElementById('avg-rating-num').innerText = promedio;
            document.getElementById('total-ratings-count').innerText = `(${totalVotos})`;
            let numEstrellasEnteras = Math.round(parseFloat(promedio));
            let estrellasStr = '★'.repeat(numEstrellasEnteras) + '☆'.repeat(5 - numEstrellasEnteras);
            document.getElementById('avg-stars-icon').innerText = estrellasStr;
        }

        async function registrarVotoEstrellas(calificacion) {
            // El voto se suma de forma atómica en la base (función votar_estrellas)
            const { data, error } = await supabaseClient
                .rpc('votar_estrellas', { p_historia: historiaActualId, p_estrellas: calificacion });
            if (error || !data) {
                console.error("Error al registrar voto:", error);
                return;
            }
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            const contenedorVoto = document.getElementById('seccion-votacion-estrellas');
            if (contenedorVoto) {
                contenedorVoto.innerHTML = `<div style="font-weight: bold; color: #28a745; padding: 10px;">¡Gracias por tu voto de ${calificacion} estrellas! ⭐</div>`;
            }
            pintarEstadisticas(data.votos, data.suma);
        }

        async function iniciarApp() {
            const telegramUser = tg.initDataUnsafe?.user;
            const params = new URLSearchParams(window.location.search);
            const startParam = tg.initDataUnsafe?.start_param;
            if ((!telegramUser || !telegramUser.id) && !params.get('historia') && !params.get('startapp') && !startParam) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram.</p>
                    </div>
                `;
                return;
            }
            verificarParametroHistoria();
            let historiaPrecargada = null;
            if (!historiaActualId) {
                // Una sola petición: trae solo UNA historia al azar (no la lista completa)
                const { data } = await supabaseClient
                    .rpc('obtener_historia_aleatoria', { p_excluir: null });
                if (data) {
                    historiaActualId = data.historia_id;
                    historiaPrecargada = data;
                }
            }
            if (!historiaActualId) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>No hay historias disponibles</h3>
                        <p>Vuelve más tarde para disfrutar de nuevas aventuras.</p>
                    </div>
                `;
                return;
            }
            pasoActualIndex = 0;
            if (historiaPrecargada) {
                aplicarConfigHistoria(historiaPrecargada);
            } else {
                historiaPrecargada = await cargarConfiguracionHistoria(historiaActualId);
            }
            await cargarCapitulo(capituloActualId, historiaPrecargada && historiaPrecargada.cap_1);
        }
        setTimeout(iniciarApp, 500);
        async function cargarCapitulo(idCapitulo, capituloPrecargado) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('hint-siguiente').style.display = 'block';
            document.getElementById('otras-historias').style.display = 'none';
            document.getElementById('progress-bars-container').style.display = 'flex';
            pasoActualIndex = obtenerIndicePorIdCapitulo(idCapitulo);
            actualizarBarritasProgreso();

            // Capítulo + opciones en UNA sola petición (o ya vienen incluidos con la historia)
            let capData = capituloPrecargado;
            if (!capData) {
                const { data, error } = await supabaseClient
                    .rpc('obtener_capitulo', { p_historia: historiaActualId, p_capitulo: idCapitulo });
                if (error || !data) return false; // no se toca imagen ni texto
                capData = data;
            }
            // La imagen cambia junto con el texto, cuando el capítulo ya está listo
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();

            const capituloData = capData;
            const opcionesValidas = capData.opciones || [];
            const opcionesList = capData.siguiente_por_defecto ? [{ siguiente_capitulo: capData.siguiente_por_defecto }] : [];
            const elementoTitulo = document.getElementById('titulo');
            if (capituloData.titulo && capituloData.titulo.trim() !== '') {
                elementoTitulo.innerText = capituloData.titulo;
                elementoTitulo.style.display = 'block';
            } else {
                elementoTitulo.innerText = '';
                elementoTitulo.style.display = 'none';
            }
            document.getElementById('pregunta').innerText = capituloData.descripcion;
            const contenedorOpciones = document.getElementById('opciones-container');
            contenedorOpciones.innerHTML = '';
            let esFinal = (idCapitulo === 'fin' || idCapitulo.includes('epilogo'));
            if (!esFinal && opcionesValidas.length === 0) {
                let siguienteDestino = 'cap_' + (pasoActualIndex + 2);
                if (opcionesList && opcionesList.length > 0 && opcionesList[0].siguiente_capitulo) {
                    siguienteDestino = opcionesList[0].siguiente_capitulo;
                }
                if (siguienteDestino === 'fin' || siguienteDestino.includes('epilogo')) {
                    esFinal = true;
                }
            }
            if (esFinal) {
                pasoActualIndex = totalPasosHistoria - 1;
                actualizarBarritasProgreso();
                document.getElementById('hint-siguiente').style.display = 'none';
                const bloqueFinal = document.createElement('div');
                bloqueFinal.innerHTML = `
                    <div class="rating-box" id="seccion-votacion-estrellas">
                        <div style="font-weight: bold; font-size: 14px;">¿Qué te pareció la historia?</div>
                        <div class="interactive-stars" id="star-selector">
                            <span onclick="registrarVotoEstrellas(1)">★</span><spanonclick="registrarVotoEstrellas(2)">★</span><spanonclick="registrarVotoEstrellas(3)">★</span><spanonclick="registrarVotoEstrellas(4)">★</span><spanonclick="registrarVotoEstrellas(5)">★</span>
                        </div>
                    </div>
                    <button class="btn btn-share" onclick="compartirReseña()">CompartirReseña</button>
                    <div class="donation-box">
                        <div class="donation-text">
                            Mantener este espacio vivo requiere tiempo y recursos. Apóyanos ahora mismo enviando un regalo a nosso canal.
                        </div>
                        <button class="btn-channel" onclick="abrirCanalRegalos()">Ver Canal</button>
                    </div>
                `;
                contenedorOpciones.appendChild(bloqueFinal);
                document.getElementById('otras-historias').style.display = 'block';
                return;
            }
            if (opcionesValidas.length > 0) {
                const opcionesAleatorias = barajarArreglo(opcionesValidas);
                opcionesAleatorias.forEach((opcion) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = opcion.texto_opcion;
                    btn.onclick = () => procesarSeleccionOpcion(opcion);
                    contenedorOpciones.appendChild(btn);
                });
            } else {
                document.getElementById('hint-siguiente').style.display = 'none';
                const btnNext = document.getElementById('btn_next');
                btnNext.style.display = 'block';
                let siguienteDestino = 'cap_' + (pasoActualIndex + 2);
                if (opcionesList && opcionesList.length > 0 && opcionesList[0].siguiente_capitulo) {
                    siguienteDestino = opcionesList[0].siguiente_capitulo;
                }
                btnNext.onclick = () => {
                    pasoActualIndex = obtenerIndicePorIdCapitulo(siguienteDestino);
                    capituloActualId = siguienteDestino;
                    cargarCapitulo(capituloActualId);
                };
            }
        }
        function compartirReseña() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            const tituloObra = document.getElementById('story-title-author').innerText;
            const botUsername = 'BetaReadsBot';
            const linkDirectoApp = `https://t.me/${botUsername}?startapp=${historiaActualId}`;
            const urlTelegramShare = `https://t.me/share/url?url=${encodeURIComponent(linkDirectoApp)}&text=${encodeURIComponent(`¡Lee "${tituloObra}" en Beta Reads!`)}`;
            if (tg && typeof tg.openTelegramLink === 'function') {
                tg.openTelegramLink(urlTelegramShare);
            } else {
                window.open(urlTelegramShare, '_blank');
            }
        }
        function abrirCanalRegalos() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            const urlCanal = 'https://t.me/BookBetaReader';
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(urlCanal);
            } else {
                window.open(urlCanal, '_blank');
            }
        }
        function procesarSeleccionOpcion(opcionElegida) {
            const botones = document.querySelectorAll('#opciones-container .btn');
            botones.forEach(b => b.disabled = true);
            document.getElementById('hint-siguiente').style.display = 'none';
            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                pasoActualIndex = obtenerIndicePorIdCapitulo(opcionElegida.siguiente_capitulo);
                capituloActualId = opcionElegida.siguiente_capitulo;
                cargarCapitulo(capituloActualId);
            };
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
