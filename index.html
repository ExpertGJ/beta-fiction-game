<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }
        .community-header {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .progress-bars {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: -4px;
            margin-bottom: 4px;
        }
        .bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            transition: background-color 0.4s ease;
        }
        .bar.active {
            background-color: #28a745;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #e0e0e0;
            color: #555;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .stories-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        .story-card {
            background: #ffffff;
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #2481cc;
        }
        .story-card:hover {
            background: #e9ecef;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Panel Superior: Promedios Comunitarios Globales -->
        <div class="stats-box" id="stats-panel">
            <div class="community-header">🌍 Promedio Global de la Comunidad</div>
            <div class="stats-grid">
                <div><span id="lbl-attr1">Attr 1</span>: <span id="comm-attr1">50</span>%</div>
                <div><span id="lbl-attr2">Attr 2</span>: <span id="comm-attr2">50</span>%</div>
                <div><span id="lbl-attr3">Attr 3</span>: <span id="comm-attr3">50</span>%</div>
                <div><span id="lbl-attr4">Attr 4</span>: <span id="comm-attr4">50</span>%</div>
            </div>
        </div>

        <img id="imagen" src="https://picsum.photos/400/200?random=1" alt="Escena" referrerpolicy="no-referrer">
        
        <!-- Barritas de Progreso Dinámicas -->
        <div class="progress-bars" id="progress-bars-container"></div>

        <div id="titulo" class="title">Cargando...</div>
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <button id="btn_a" class="btn" disabled>Opción A</button>
        <button id="btn_b" class="btn" disabled>Opción B</button>

        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>

        <!-- Selector de otras historias al terminar -->
        <div id="otras-historias" class="stories-box">
            <h3>📖 Otras Historias Disponibles</h3>
            <div id="lista-historias"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        let historiaActualId = 'mansion_misterio';
        let capituloActualId = 'cap_1';
        let totalPasosHistoria = 3; // Se carga desde config_historia
        let pasoActualIndex = 0; 

        let nombresAtributos = {
            attr1: 'Atributo 1',
            attr2: 'Atributo 2',
            attr3: 'Atributo 3',
            attr4: 'Atributo 4'
        };

        let jugador = {
            attr1: 50,
            attr2: 50,
            attr3: 50,
            attr4: 50
        };

        function ajustarEscala(actual, delta) {
            return Math.min(100, Math.max(0, actual + delta));
        }

        // Función inteligente: Lee el ID del capítulo (ej: 'cap_2a', 'cap_3', 'fin') y determina cuántas barras iluminar
        function obtenerIndicePorIdCapitulo(idCap) {
            if (idCap === 'fin') return totalPasosHistoria - 1;
            const match = idCap.match(/\d+/);
            if (match) {
                const num = parseInt(match[0], 10);
                return Math.min(totalPasosHistoria - 1, Math.max(0, num - 1));
            }
            return pasoActualIndex;
        }

        function actualizarBarritasProgreso() {
            const contenedor = document.getElementById('progress-bars-container');
            let htmlBarritas = '';
            
            for (let i = 0; i < totalPasosHistoria; i++) {
                let claseActiva = i <= pasoActualIndex ? 'bar active' : 'bar';
                htmlBarritas += `<div class="${claseActiva}"></div>`;
            }
            
            contenedor.innerHTML = htmlBarritas;
        }

        async function cargarConfiguracionHistoria(hId) {
            const { data } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('historia_id', hId)
                .maybeSingle();

            if (data) {
                nombresAtributos.attr1 = data.attr_1_nombre;
                nombresAtributos.attr2 = data.attr_2_nombre;
                nombresAtributos.attr3 = data.attr_3_nombre;
                nombresAtributos.attr4 = data.attr_4_nombre;
                totalPasosHistoria = data.total_pasos || 3;

                document.getElementById('lbl-attr1').innerText = data.attr_1_nombre;
                document.getElementById('lbl-attr2').innerText = data.attr_2_nombre;
                document.getElementById('lbl-attr3').innerText = data.attr_3_nombre;
                document.getElementById('lbl-attr4').innerText = data.attr_4_nombre;
            }
        }

        async function actualizarEstadisticasComunidad() {
            const { data: todosLosVotos } = await supabaseClient
                .from('votos')
                .select('*');

            if (!todosLosVotos || todosLosVotos.length === 0) return;

            let totalPartidas = todosLosVotos.length;
            let a1 = 50 * totalPartidas, a2 = 50 * totalPartidas, a3 = 50 * totalPartidas, a4 = 50 * totalPartidas;

            todosLosVotos.forEach(v => {
                if (v.opcion === 'A') {
                    a1 += 10; a2 -= 5; a3 += 10; a4 -= 10;
                } else {
                    a1 -= 5; a2 += 10; a3 -= 5; a4 += 5;
                }
            });

            document.getElementById('comm-attr1').innerText = Math.min(100, Math.max(0, Math.round(a1 / totalPartidas)));
            document.getElementById('comm-attr2').innerText = Math.min(100, Math.max(0, Math.round(a2 / totalPartidas)));
            document.getElementById('comm-attr3').innerText = Math.min(100, Math.max(0, Math.round(a3 / totalPartidas)));
            document.getElementById('comm-attr4').innerText = Math.min(100, Math.max(0, Math.round(a4 / totalPartidas)));
        }

        async function iniciarApp() {
            const telegramUser = tg.initDataUnsafe?.user;
            if (!telegramUser || !telegramUser.id) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram para jugar.</p>
                    </div>
                `;
                return;
            }

            const { data: historiaActiva } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('activa', true)
                .limit(1)
                .maybeSingle();

            if (historiaActiva) {
                historiaActualId = historiaActiva.historia_id;
            }

            pasoActualIndex = 0;
            await cargarConfiguracionHistoria(historiaActualId);
            await actualizarEstadisticasComunidad();
            cargarCapitulo(capituloActualId);
        }

        setTimeout(iniciarApp, 500);

        async function cargarCapitulo(idCapitulo) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('otras-historias').style.display = 'none';
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();
            actualizarBarritasProgreso();

            const { data, error } = await supabaseClient
                .from('capitulos')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('id', idCapitulo)
                .maybeSingle();

            if (error || !data || idCapitulo === 'fin') {
                pasoActualIndex = totalPasosHistoria - 1;
                actualizarBarritasProgreso();

                document.getElementById('titulo').innerText = '🏆 Fin de la Aventura';
                document.getElementById('pregunta').innerText = `Has completado la historia.\n\n📊 Tu Resultado Individual:\n` +
                    `${nombresAtributos.attr1}: ${jugador.attr1}% | ${nombresAtributos.attr2}: ${jugador.attr2}%\n` +
                    `${nombresAtributos.attr3}: ${jugador.attr3}% | ${nombresAtributos.attr4}: ${jugador.attr4}%`;
                document.getElementById('btn_a').style.display = 'none';
                document.getElementById('btn_b').style.display = 'none';
                document.getElementById('progress-bars-container').style.display = 'none';
                
                mostrarOtrasHistorias();
                return;
            }

            document.getElementById('titulo').innerText = data.titulo;
            document.getElementById('pregunta').innerText = data.descripcion;
            
            const btnA = document.getElementById('btn_a');
            const btnB = document.getElementById('btn_b');

            btnA.innerText = data.opcion_a_texto;
            btnB.innerText = data.opcion_b_texto;
            btnA.disabled = false;
            btnB.disabled = false;
            btnA.style.display = 'block';
            btnB.style.display = 'block';

            btnA.onclick = () => procesarVoto('A', data.opcion_a_siguiente, data.opcion_a_attr1, data.opcion_a_attr2, data.opcion_a_attr3, data.opcion_a_attr4, data);
            btnB.onclick = () => procesarVoto('B', data.opcion_b_siguiente, data.opcion_b_attr1, data.opcion_b_attr2, data.opcion_b_attr3, data.opcion_b_attr4, data);
        }

        async function procesarVoto(opcionElegida, siguienteId, dA1, dA2, dA3, dA4, datosCap) {
            const telegramUser = tg.initDataUnsafe?.user;
            
            document.getElementById('btn_a').disabled = true;
            document.getElementById('btn_b').disabled = true;

            jugador.attr1 = ajustarEscala(jugador.attr1, dA1 || 0);
            jugador.attr2 = ajustarEscala(jugador.attr2, dA2 || 0);
            jugador.attr3 = ajustarEscala(jugador.attr3, dA3 || 0);
            jugador.attr4 = ajustarEscala(jugador.attr4, dA4 || 0);

            await supabaseClient.from('votos').insert([
                { user_id: telegramUser.id.toString(), capitulo_id: capituloActualId, opcion: opcionElegida }
            ]);

            const { data: todosVotos } = await supabaseClient
                .from('votos')
                .select('opcion')
                .eq('capitulo_id', capituloActualId);

            const total = todosVotos.length;
            const votosA = todosVotos.filter(v => v.opcion === 'A').length;
            const votosB = total - votosA;
            const porcA = total > 0 ? Math.round((votosA / total) * 100) : 0;
            const porcB = total > 0 ? 100 - porcA : 0;

            document.getElementById('btn_a').innerHTML = `${datosCap.opcion_a_texto}<br><span style="font-size: 13px; font-weight: normal;">Opción A: ${porcA}% (${votosA} votos)</span>`;
            document.getElementById('btn_b').innerHTML = `${datosCap.opcion_b_texto}<br><span style="font-size: 13px; font-weight: normal;">Opción B: ${porcB}% (${votosB} votos)</span>`;

            await actualizarEstadisticasComunidad();

            // Actualizamos las barritas basándonos en el ID del capítulo de destino
            pasoActualIndex = obtenerIndicePorIdCapitulo(siguienteId);
            actualizarBarritasProgreso();

            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                capituloActualId = siguienteId;
                cargarCapitulo(siguienteId);
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        async function mostrarOtrasHistorias() {
            const { data: lista } = await supabaseClient
                .from('config_historia')
                .select('*');

            if (!lista || lista.length <= 1) return;

            const contenedorLista = document.getElementById('lista-historias');
            contenedorLista.innerHTML = '';

            lista.forEach(h => {
                if (h.historia_id !== historiaActualId) {
                    const card = document.createElement('div');
                    card.className = 'story-card';
                    card.innerText = h.titulo_historia;
                    card.onclick = async () => {
                        historiaActualId = h.historia_id;
                        capituloActualId = 'cap_1';
                        pasoActualIndex = 0; 
                        jugador = { attr1: 50, attr2: 50, attr3: 50, attr4: 50 };
                        document.getElementById('progress-bars-container').style.display = 'flex';
                        
                        await cargarConfiguracionHistoria(historiaActualId);
                        cargarCapitulo(capituloActualId);
                    };
                    contenedorLista.appendChild(card);
                }
            });

            document.getElementById('otras-historias').style.display = 'block';
        }
    </script>
</body>
</html>
