<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Reads</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }
        .stats-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-arrow {
            background: none;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #2481cc);
            cursor: pointer;
            padding: 0 8px;
            user-select: none;
            transition: opacity 0.2s;
        }
        .nav-arrow:hover {
            opacity: 0.7;
        }
        .story-author-header {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            color: var(--tg-theme-text-color, #000000);
        }
        .author-name {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .stars-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 15px;
            font-weight: bold;
        }
        .stars-display {
            color: #ffc107;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .rating-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .interactive-stars {
            font-size: 28px;
            color: #ccc;
            cursor: pointer;
            letter-spacing: 4px;
            user-select: none;
        }
        .interactive-stars span {
            transition: color 0.2s;
        }
        .interactive-stars span:hover,
        .interactive-stars span.active {
            color: #ffc107;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .progress-bars {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: -4px;
            margin-bottom: 4px;
        }
        .bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            transition: background-color 0.4s ease;
        }
        .bar.active {
            background-color: #28a745;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            margin-bottom: 2px;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .instruction-hint {
            font-style: italic;
            text-align: center;
            font-size: 14px;
            margin-top: 4px;
            color: var(--tg-theme-hint-color, #707579);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #e0e0e0;
            color: #555;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .stories-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
        .story-card {
            background: #ffffff;
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
        }
        .story-card:hover {
            background: #e9ecef;
        }
        .story-card-title {
            font-weight: bold;
            color: #2481cc;
            font-size: 15px;
        }
        .story-card-author {
            font-size: 12px;
            color: #666;
            font-style: italic;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .donation-box {
            background: #fff9e6;
            border: 1px solid #ffe0b2;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .donation-text {
            font-size: 13px;
            font-style: italic;
            color: #5c3c10;
            line-height: 1.4;
            padding: 0 8px;
        }
        .btn-channel {
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(36, 129, 204, 0.35);
        }
        .btn-share {
            background-color: #17a2b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Panel Superior: Flecha anterior, Título/Estrellas/Autor y Flecha siguiente -->
        <div class="stats-box" id="stats-panel">
            <button class="nav-arrow" onclick="cambiarHistoriaAdyacente(-1)">&#10094;</button>
            <div class="stats-center">
                <div id="story-title-author" class="story-author-header">Cargando historia...</div>
                <div class="stars-container">
                    <span id="avg-rating-num">0.0</span>
                    <span class="stars-display" id="avg-stars-icon">★★★★★</span>
                    <span id="total-ratings-count">(0)</span>
                </div>
                <div id="story-author-name" class="author-name">Autor: Cargando...</div>
            </div>
            <button class="nav-arrow" onclick="cambiarHistoriaAdyacente(1)">&#10095;</button>
        </div>

        <!-- Imagen de la escena -->
        <img id="imagen" alt="Escena" referrerpolicy="no-referrer">
        
        <!-- Barritas de Progreso Dinámicas -->
        <div class="progress-bars" id="progress-bars-container"></div>

        <!-- Título condicional del capítulo/sección -->
        <div id="titulo" class="title" style="display: none;"></div>
        <!-- Descripción de la escena -->
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <!-- Contenedor dinámico de opciones -->
        <div id="opciones-container" class="options-container"></div>
        
        <!-- Texto agregado debajo de las opciones -->
        <div id="hint-siguiente" class="instruction-hint">¡Elige una opción y presiona siguiente!</div>

        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>

        <!-- Selector de otras historias al terminar -->
        <div id="otras-historias" class="stories-box">
            <h3>Historias Disponibles</h3>
            <div id="lista-historias"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        let historiaActualId = 'mansion_misterio';
        let capituloActualId = 'cap_1';
        let totalPasosHistoria = 3; 
        let pasoActualIndex = 0; 
        let autorActualNombre = '';
        let listaTodasHistorias = [];

        function verificarParametroHistoria() {
            const params = new URLSearchParams(window.location.search);
            let historiaParam = params.get('historia') || params.get('startapp');
            
            if (!historiaParam && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                historiaParam = tg.initDataUnsafe.start_param;
            }

            if (historiaParam) {
                historiaActualId = historiaParam;
            }
        }

        function barajarArreglo(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function obtenerIndicePorIdCapitulo(idCap) {
            if (idCap === 'fin' || idCap.includes('epilogo')) return totalPasosHistoria - 1;
            const match = idCap.match(/\d+/);
            if (match) {
                const num = parseInt(match[0], 10);
                return Math.min(totalPasosHistoria - 1, Math.max(0, num - 1));
            }
            return pasoActualIndex;
        }

        function actualizarBarritasProgreso() {
            const contenedor = document.getElementById('progress-bars-container');
            let htmlBarritas = '';
            
            for (let i = 0; i < totalPasosHistoria; i++) {
                let claseActiva = i <= pasoActualIndex ? 'bar active' : 'bar';
                htmlBarritas += `<div class="${claseActiva}"></div>`;
            }
            
            contenedor.innerHTML = htmlBarritas;
        }

        async function cargarListaHistoriasGlobal() {
            // Filtra únicamente las historias que tengan estado 'publico'
            const { data } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('estado', 'publico');
            if (data) {
                listaTodasHistorias = data;
            }
        }

        async function cambiarHistoriaAdyacente(direccion) {
            if (!listaTodasHistorias || listaTodasHistorias.length === 0) {
                await cargarListaHistoriasGlobal();
            }
            if (!listaTodasHistorias || listaTodasHistorias.length === 0) return;

            let currentIndex = listaTodasHistorias.findIndex(h => h.historia_id === historiaActualId);
            if (currentIndex === -1) currentIndex = 0;

            let nuevoIndex = currentIndex + direccion;
            if (nuevoIndex >= listaTodasHistorias.length) {
                nuevoIndex = 0; 
            } else if (nuevoIndex < 0) {
                nuevoIndex = listaTodasHistorias.length - 1; 
            }

            const nuevaHistoria = listaTodasHistorias[nuevoIndex];
            historiaActualId = nuevaHistoria.historia_id;
            capituloActualId = 'cap_1';
            pasoActualIndex = 0;
            document.getElementById('progress-bars-container').style.display = 'flex';

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

            await cargarConfiguracionHistoria(historiaActualId);
            await actualizarEstadisticasComunidad();
            cargarCapitulo(capituloActualId);
        }

        async function cargarConfiguracionHistoria(hId) {
            const { count, error } = await supabaseClient
                .from('capitulos')
                .select('*', { count: 'exact', head: true })
                .eq('historia_id', hId);

            if (!error && count && count > 0) {
                totalPasosHistoria = count;
            }

            const { data: configData } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('historia_id', hId)
                .maybeSingle();

            if (configData) {
                autorActualNombre = configData.autor || 'Desconocido';
                document.getElementById('story-title-author').innerText = configData.titulo_historia;
                document.getElementById('story-author-name').innerText = `Autor: ${autorActualNombre}`;
            }
        }

        async function actualizarEstadisticasComunidad() {
            const { data, error } = await supabaseClient
                .from('promedios_globales')
                .select('*')
                .eq('historia_id', historiaActualId)
                .maybeSingle();

            if (error || !data) {
                document.getElementById('avg-rating-num').innerText = '0.0';
                document.getElementById('avg-stars-icon').innerText = '☆☆☆☆☆';
                document.getElementById('total-ratings-count').innerText = '(0)';
                return;
            }

            let totalVotos = data.total_votos_estrellas || 0;
            let sumaEstrellas = data.suma_estrellas || 0;
            let promedio = totalVotos > 0 ? (sumaEstrellas / totalVotos).toFixed(1) : '0.0';

            document.getElementById('avg-rating-num').innerText = promedio;
            document.getElementById('total-ratings-count').innerText = `(${totalVotos})`;

            let numEstrellasEnteras = Math.round(parseFloat(promedio));
            let estrellasStr = '★'.repeat(numEstrellasEnteras) + '☆'.repeat(5 - numEstrellasEnteras);
            document.getElementById('avg-stars-icon').innerText = estrellasStr;
        }

        async function registrarVotoEstrellas(calificacion) {
            const { data: actual } = await supabaseClient
                .from('promedios_globales')
                .select('*')
                .eq('historia_id', historiaActualId)
                .maybeSingle();

            let errorAccion = null;

            if (actual) {
                let nuevoTotalVotos = (actual.total_votos_estrellas || 0) + 1;
                let nuevaSumaEstrellas = (actual.suma_estrellas || 0) + calificacion;

                const { error } = await supabaseClient
                    .from('promedios_globales')
                    .update({
                        total_votos_estrellas: nuevoTotalVotos,
                        suma_estrellas: nuevaSumaEstrellas
                    })
                    .eq('historia_id', historiaActualId);
                errorAccion = error;
            } else {
                const { error } = await supabaseClient
                    .from('promedios_globales')
                    .insert([{
                        historia_id: historiaActualId,
                        total_votos_estrellas: 1,
                        suma_estrellas: calificacion
                    }]);
                errorAccion = error;
            }

            if (errorAccion) {
                console.error("Error al registrar voto:", errorAccion);
                return;
            }

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const contenedorVoto = document.getElementById('seccion-votacion-estrellas');
            if (contenedorVoto) {
                contenedorVoto.innerHTML = `<div style="font-weight: bold; color: #28a745; padding: 10px;">¡Gracias por tu voto de ${calificacion} estrellas! ⭐</div>`;
            }
            await actualizarEstadisticasComunidad();
        }

        async function iniciarApp() {
            const telegramUser = tg.initDataUnsafe?.user;
            const params = new URLSearchParams(window.location.search);
            const startParam = tg.initDataUnsafe?.start_param;
            
            if ((!telegramUser || !telegramUser.id) && !params.get('historia') && !params.get('startapp') && !startParam) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram.</p>
                    </div>
                `;
                return;
            }

            verificarParametroHistoria();
            await cargarListaHistoriasGlobal();

            // Si no hay ninguna historia pública disponible, mostramos un mensaje arregladito
            if (!listaTodasHistorias || listaTodasHistorias.length === 0) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>No hay historias disponibles</h3>
                        <p>Vuelve más tarde para disfrutar de nuevas aventuras.</p>
                    </div>
                `;
                return;
            }

            // Cargar por defecto la primera historia que esté pública
            const { data: historiaActiva } = await supabaseClient
                .from('config_historia')
                .select('*')
                .eq('estado', 'publico')
                .limit(1)
                .maybeSingle();

            if (!params.get('historia') && !params.get('startapp') && !startParam && historiaActiva) {
                historiaActualId = historiaActiva.historia_id;
            }

            pasoActualIndex = 0;
            await cargarConfiguracionHistoria(historiaActualId);
            await actualizarEstadisticasComunidad();
            cargarCapitulo(capituloActualId);
        }

        setTimeout(iniciarApp, 500);

        async function cargarCapitulo(idCapitulo) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('hint-siguiente').style.display = 'block';
            document.getElementById('otras-historias').style.display = 'none';
            document.getElementById('progress-bars-container').style.display = 'flex';
            
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();
            pasoActualIndex = obtenerIndicePorIdCapitulo(idCapitulo);
            actualizarBarritasProgreso();

            const { data: opcionesList } = await supabaseClient
                .from('opciones')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('capitulo_id', idCapitulo);

            const opcionesValidas = opcionesList ? opcionesList.filter(o => o.texto_opcion && o.texto_opcion.trim() !== '' && o.texto_opcion.trim() !== 'EMPTY') : [];

            const { data: capituloData, error } = await supabaseClient
                .from('capitulos')
                .select('*')
                .eq('historia_id', historiaActualId)
                .eq('capitulo_id', idCapitulo)
                .maybeSingle();

            if (error || !capituloData) return;

            const elementoTitulo = document.getElementById('titulo');
            if (capituloData.titulo && capituloData.titulo.trim() !== '') {
                elementoTitulo.innerText = capituloData.titulo;
                elementoTitulo.style.display = 'block';
            } else {
                elementoTitulo.innerText = '';
                elementoTitulo.style.display = 'none';
            }

            document.getElementById('pregunta').innerText = capituloData.descripcion;

            const contenedorOpciones = document.getElementById('opciones-container');
            contenedorOpciones.innerHTML = '';

            let esFinal = (idCapitulo === 'fin' || idCapitulo.includes('epilogo'));
            if (!esFinal && opcionesValidas.length === 0) {
                let siguienteDestino = 'cap_' + (pasoActualIndex + 2);
                if (opcionesList && opcionesList.length > 0 && opcionesList[0].siguiente_capitulo) {
                    siguienteDestino = opcionesList[0].siguiente_capitulo;
                }
                if (siguienteDestino === 'fin' || siguienteDestino.includes('epilogo')) {
                    esFinal = true;
                }
            }

            if (esFinal) {
                pasoActualIndex = totalPasosHistoria - 1;
                actualizarBarritasProgreso();

                document.getElementById('hint-siguiente').style.display = 'none';

                const bloqueFinal = document.createElement('div');
                bloqueFinal.innerHTML = `
                    <div class="rating-box" id="seccion-votacion-estrellas">
                        <div style="font-weight: bold; font-size: 14px;">¿Qué te pareció la historia? Califícala:</div>
                        <div class="interactive-stars" id="star-selector">
                            <span onclick="registrarVotoEstrellas(1)">★</span><span onclick="registrarVotoEstrellas(2)">★</span><span onclick="registrarVotoEstrellas(3)">★</span><span onclick="registrarVotoEstrellas(4)">★</span><span onclick="registrarVotoEstrellas(5)">★</span>
                        </div>
                    </div>

                    <button class="btn btn-share" onclick="compartirHistoria()">Compartir Historia</button>

                    <div class="donation-box">
                        <div class="donation-text">
                            Mantener este espacio vivo requiere tiempo y recursos. Apóyanos ahora mismo enviando un regalo a nuestro canal.
                        </div>
                        <button class="btn-channel" onclick="abrirCanalRegalos()">Ver Canal</button>
                    </div>
                `;
                contenedorOpciones.appendChild(bloqueFinal);
                
                mostrarOtrasHistorias();
                return;
            }

            if (opcionesValidas.length > 0) {
                const opcionesAleatorias = barajarArreglo(opcionesValidas);

                opcionesAleatorias.forEach((opcion) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = opcion.texto_opcion;
                    btn.onclick = () => procesarSeleccionOpcion(opcion);
                    contenedorOpciones.appendChild(btn);
                });
            } else {
                document.getElementById('hint-siguiente').style.display = 'none';
                const btnNext = document.getElementById('btn_next');
                btnNext.style.display = 'block';
                
                let siguienteDestino = 'cap_' + (pasoActualIndex + 2);
                if (opcionesList && opcionesList.length > 0 && opcionesList[0].siguiente_capitulo) {
                    siguienteDestino = opcionesList[0].siguiente_capitulo;
                }

                btnNext.onclick = () => {
                    pasoActualIndex = obtenerIndicePorIdCapitulo(siguienteDestino);
                    capituloActualId = siguienteDestino;
                    cargarCapitulo(capituloActualId);
                };
            }
        }

        function compartirHistoria() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const tituloObra = document.getElementById('story-title-author').innerText;
            const botUsername = 'BetaReadsBot'; 
            
            const linkDirectoApp = `https://t.me/${botUsername}?startapp=${historiaActualId}`;
            const urlTelegramShare = `https://t.me/share/url?url=${encodeURIComponent(linkDirectoApp)}&text=${encodeURIComponent(`¡Lee "${tituloObra}" en Beta Reads! 📖✨`)}`;

            if (tg && typeof tg.openTelegramLink === 'function') {
                tg.openTelegramLink(urlTelegramShare);
            } else {
                window.open(urlTelegramShare, '_blank');
            }
        }

        function abrirCanalRegalos() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const urlCanal = 'https://t.me/BookBetaReader';

            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(urlCanal);
            } else {
                window.open(urlCanal, '_blank');
            }
        }

        function procesarSeleccionOpcion(opcionElegida) {
            const botones = document.querySelectorAll('#opciones-container .btn');
            botones.forEach(b => b.disabled = true);
            
            document.getElementById('hint-siguiente').style.display = 'none';

            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                pasoActualIndex = obtenerIndicePorIdCapitulo(opcionElegida.siguiente_capitulo);
                capituloActualId = opcionElegida.siguiente_capitulo;
                cargarCapitulo(capituloActualId);
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        async function mostrarOtrasHistorias() {
            if (!listaTodasHistorias || listaTodasHistorias.length <= 1) {
                await cargarListaHistoriasGlobal();
            }

            if (!listaTodasHistorias || listaTodasHistorias.length <= 1) return;

            const contenedorLista = document.getElementById('lista-historias');
            contenedorLista.innerHTML = '';

            listaTodasHistorias.forEach(h => {
                if (h.historia_id !== historiaActualId) {
                    const card = document.createElement('div');
                    card.className = 'story-card';
                    card.innerHTML = `
                        <div class="story-card-title">${h.titulo_historia}</div>
                        <div class="story-card-author">Autor: ${h.autor || 'Desconocido'}</div>
                    `;
                    card.onclick = async () => {
                        historiaActualId = h.historia_id;
                        capituloActualId = 'cap_1';
                        pasoActualIndex = 0; 
                        document.getElementById('progress-bars-container').style.display = 'flex';
                        
                        await cargarConfiguracionHistoria(historiaActualId);
                        await actualizarEstadisticasComunidad();
                        cargarCapitulo(capituloActualId);
                    };
                    contenedorLista.appendChild(card);
                }
            });

            document.getElementById('otras-historias').style.display = 'block';
        }
    </script>
</body>
</html>
