<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .status-badge {
            background: rgba(0,0,0,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 250px;
            background-color: #eee;
        }
        .question {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            text-align: center;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #mensaje {
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="status" class="status-badge">Verificando acceso...</div>
        <img id="imagen" src="https://picsum.photos/400/200" alt="Escena" referrerpolicy="no-referrer">
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <button id="btn_a" class="btn" disabled>Opción A</button>
        <button id="btn_b" class="btn" disabled>Opción B</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        // ---- Manejo de imagen con respaldo ----
        const imgEl = document.getElementById('imagen');

        function urlRespaldo() {
            // Foto aleatoria distinta cada vez
            return 'https://picsum.photos/400/200?random=' + Date.now();
        }

        let intentosRespaldo = 0;
        imgEl.addEventListener('error', () => {
            // Si falla el link (o el respaldo), prueba otro respaldo máximo 2 veces
            if (intentosRespaldo < 2) {
                intentosRespaldo++;
                imgEl.src = urlRespaldo();
            }
        });

        function mostrarImagen(url) {
            intentosRespaldo = 0;
            const limpia = (url || '').trim();
            imgEl.src = limpia ? limpia : urlRespaldo();
        }
        // ---------------------------------------

        // Damos un pequeño respiro para que el SDK de Telegram cargue sus datos si se abrió desde el bot
        setTimeout(() => {
            const telegramUser = tg.initDataUnsafe?.user;

            if (!telegramUser || !telegramUser.id) {
                // Si no hay usuario de Telegram, mostramos el aviso bloqueado inmediatamente
                document.getElementById('status').innerText = '🔒 Acceso restringido';
                document.getElementById('imagen').style.display = 'none';
                document.getElementById('btn_a').style.display = 'none';
                document.getElementById('btn_b').style.display = 'none';
                
                document.getElementById('pregunta').innerHTML = `
                    <div class="blocked-card">
                        <h3>¡Atención!</h3>
                        <p>Esta aventura interactiva está diseñada para jugarse exclusivamente desde nuestra <strong>Mini App oficial en Telegram</strong>.</p>
                        <p>Por favor, abre nuestro bot en Telegram para votar y participar con tu comunidad.</p>
                    </div>
                `;
            } else {
                // Si es un usuario válido de Telegram, cargamos el juego con normalidad
                iniciarJuego(telegramUser.id.toString());
            }
        }, 500);

        async function iniciarJuego(userId) {
            let capituloActualId = '';

            try {
                const { data, error } = await supabaseClient
                    .from('capitulo_activo')
                    .select('*')
                    .limit(1)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    capituloActualId = data.capitulo_id;
                    document.getElementById('status').innerText = data.estado_personaje || 'Estado activo';
                    mostrarImagen(data.imagen_url);
                    document.getElementById('pregunta').innerText = data.pregunta || 'Sin pregunta definida';
                    document.getElementById('btn_a').innerText = data.opcion_a || 'Opción A';
                    document.getElementById('btn_b').innerText = data.opcion_b || 'Opción B';
                    
                    document.getElementById('btn_a').disabled = false;
                    document.getElementById('btn_b').disabled = false;
                    
                    document.getElementById('btn_a').onclick = () => votar(capituloActualId, userId, 'A');
                    document.getElementById('btn_b').onclick = () => votar(capituloActualId, userId, 'B');

                    verificarVotoPrevio(capituloActualId, userId);
                } else {
                    document.getElementById('pregunta').innerText = 'No hay capítulos activos configurados.';
                    bloquearBotones();
                }
            } catch (err) {
                console.error("Detalle del error:", err);
                document.getElementById('pregunta').innerText = 'Error al conectar con Supabase: ' + err.message;
            }
        }

        async function verificarVotoPrevio(capituloId, userId) {
            const { data } = await supabaseClient
                .from('votos')
                .select('opcion')
                .eq('capitulo_id', capituloId)
                .eq('user_id', userId)
                .maybeSingle();

            if (data) {
                bloquearBotones();
                document.getElementById('mensaje').innerText = `✅ ¡Ya votaste por la opción: ${data.opcion}!`;
                document.getElementById('mensaje').style.color = 'green';
            }
        }

        async function votar(capituloId, userId, opcionSeleccionada) {
            bloquearBotones();
            document.getElementById('mensaje').innerText = 'Registrando voto...';

            const { error } = await supabaseClient
                .from('votos')
                .insert([
                    { capitulo_id: capituloId, user_id: userId, opcion: opcionSeleccionada }
                ]);

            if (error) {
                console.error(error);
                if (error.code === '23505') {
                    document.getElementById('mensaje').innerText = '⚠️ Ya habías votado anteriormente.';
                    document.getElementById('mensaje').style.color = 'orange';
                } else {
                    document.getElementById('mensaje').innerText = '❌ Error: ' + error.message;
                    document.getElementById('mensaje').style.color = 'red';
                }
            } else {
                document.getElementById('mensaje').innerText = '🎉 ¡Voto registrado con éxito!';
                document.getElementById('mensaje').style.color = 'green';
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        function bloquearBotones() {
            document.getElementById('btn_a').disabled = true;
            document.getElementById('btn_b').disabled = true;
        }
    </script>
</body>
</html>
