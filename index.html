<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .status-badge {
            background: rgba(0,0,0,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 250px;
            background-color: #eee;
        }
        .question {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #mensaje {
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="status" class="status-badge">Verificando acceso...</div>
        <img id="imagen" src="https://picsum.photos/400/200" alt="Escena">
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <button id="btn_a" class="btn" disabled>Opción A</button>
        <button id="btn_b" class="btn" disabled>Opción B</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbduzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        // Validar si el usuario viene estrictamente de Telegram
        const telegramUser = tg.initDataUnsafe?.user;

        if (!telegramUser || !telegramUser.id) {
            // Si entra por navegador web externo, bloqueamos la app
            document.getElementById('status').innerText = 'Acceso Denegado';
            document.getElementById('pregunta').innerText = '⚠️ Esta Mini App solo puede ser utilizada desde el bot oficial en Telegram.';
            document.getElementById('btn_a').style.display = 'none';
            document.getElementById('btn_b').style.display = 'none';
        } else {
            // Si es un usuario legítimo de Telegram, procedemos normalmente
            const userId = telegramUser.id.toString();
            let capituloActualId = '';

            async function cargarCapitulo() {
                try {
                    const { data, error } = await supabaseClient
                        .from('capitulo_activo')
                        .select('*')
                        .limit(1)
                        .maybeSingle();

                    if (error) throw error;

                    if (data) {
                        capituloActualId = data.capitulo_id;
                        document.getElementById('status').innerText = data.estado_personaje || 'Estado activo';
                        document.getElementById('imagen').src = data.imagen_url || 'https://picsum.photos/400/200';
                        document.getElementById('pregunta').innerText = data.pregunta || 'Sin pregunta definida';
                        document.getElementById('btn_a').innerText = data.opcion_a || 'Opción A';
                        document.getElementById('btn_b').innerText = data.opcion_b || 'Opción B';
                        
                        document.getElementById('btn_a').disabled = false;
                        document.getElementById('btn_b').disabled = false;
                        
                        document.getElementById('btn_a').onclick = () => votar('A');
                        document.getElementById('btn_b').onclick = () => votar('B');

                        verificarVotoPrevio();
                    } else {
                        document.getElementById('pregunta').innerText = 'No hay capítulos activos configurados.';
                        bloquearBotones();
                    }
                } catch (err) {
                    console.error("Detalle del error:", err);
                    document.getElementById('pregunta').innerText = 'Error al conectar con Supabase: ' + err.message;
                }
            }

            async function verificarVotoPrevio() {
                if (!capituloActualId) return;
                const { data } = await supabaseClient
                    .from('votos')
                    .select('opcion')
                    .eq('capitulo_id', capituloActualId)
                    .eq('user_id', userId)
                    .maybeSingle();

                if (data) {
                    bloquearBotones();
                    document.getElementById('mensaje').innerText = `✅ ¡Ya votaste por la opción: ${data.opcion}!`;
                    document.getElementById('mensaje').style.color = 'green';
                }
            }

            async function votar(opcionSeleccionada) {
                bloquearBotones();
                document.getElementById('mensaje').innerText = 'Registrando voto...';

                const { error } = await supabaseClient
                    .from('votos')
                    .insert([
                        { capitulo_id: capituloActualId, user_id: userId, opcion: opcionSeleccionada }
                    ]);

                if (error) {
                    console.error(error);
                    if (error.code === '23505') {
                        document.getElementById('mensaje').innerText = '⚠️ Ya habías votado anteriormente.';
                        document.getElementById('mensaje$.style.color = 'orange';
                    } else {
                        document.getElementById('mensaje').innerText = '❌ Error: ' + error.message;
                        document.getElementById('mensaje').style.color = 'red';
                    }
                } else {
                    document.getElementById('mensaje').innerText = '🎉 ¡Voto registrado con éxito!';
                    document.getElementById('mensaje').style.color = 'green';
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                }
            }

            function bloquearBotones() {
                document.getElementById('btn_a').disabled = true;
                document.getElementById('btn_b').disabled = true;
            }

            cargarCapitulo();
        }
    </script>
</body>
</html>
