<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }
        .community-header {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #e0e0e0;
            color: #555;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Panel Superior: Promedios Comunitarios Globales -->
        <div class="stats-box" id="stats-panel">
            <div class="community-header">🌍 Promedio Global de la Comunidad</div>
            <div>⚖️ Rep.: <span id="comm-rep">50</span>% | ⚡ Vit.: <span id="comm-vit">100</span>% | 🎯 Prog.: <span id="comm-prog">0</span>%</div>
            <div style="font-size: 11px; color: #444; margin-top: 2px;">👥 Partidas Totales: <span id="comm-total">0</span></div>
        </div>

        <img id="imagen" src="https://picsum.photos/400/200?random=1" alt="Escena" referrerpolicy="no-referrer">
        <div id="titulo" class="title">Cargando...</div>
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <button id="btn_a" class="btn" disabled>Opción A</button>
        <button id="btn_b" class="btn" disabled>Opción B</button>

        <!-- Botón para avanzar -->
        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        let jugador = {
            reputacion: 50,
            vitalidad: 100,
            progreso: 0
        };

        let capituloActualId = 'cap_1';

        function ajustarEscala(actual, delta) {
            return Math.min(100, Math.max(0, actual + delta));
        }

        async function actualizarEstadisticasComunidad() {
            const { data: todosLosVotos, error } = await supabaseClient
                .from('votos')
                .select('*');

            if (error || !todosLosVotos || todosLosVotos.length === 0) {
                document.getElementById('comm-rep').innerText = 50;
                document.getElementById('comm-vit').innerText = 100;
                document.getElementById('comm-prog').innerText = 0;
                document.getElementById('comm-total').innerText = 0;
                return;
            }

            let totalPartidas = todosLosVotos.length;
            let sumaRep = 50 * totalPartidas;
            let sumaVit = 100 * totalPartidas;
            let sumaProg = 0;

            todosLosVotos.forEach(v => {
                if (v.opcion === 'A') {
                    sumaRep += 10;
                    sumaVit -= 15;
                    sumaProg += 15;
                } else {
                    sumaRep += 5;
                    sumaVit -= 5;
                    sumaProg += 10;
                }
            });

            let promRep = Math.round(sumaRep / totalPartidas);
            let promVit = Math.round(sumaVit / totalPartidas);
            let promProg = Math.round(sumaProg / totalPartidas);

            document.getElementById('comm-rep').innerText = Math.min(100, Math.max(0, promRep));
            document.getElementById('comm-vit').innerText = Math.min(100, Math.max(0, promVit));
            document.getElementById('comm-prog').innerText = Math.min(100, Math.max(0, promProg));
            document.getElementById('comm-total').innerText = totalPartidas;
        }

        setTimeout(() => {
            const telegramUser = tg.initDataUnsafe?.user;
            if (!telegramUser || !telegramUser.id) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram para jugar.</p>
                    </div>
                `;
            } else {
                actualizarEstadisticasComunidad();
                cargarCapitulo(capituloActualId);
            }
        }, 500);

        async function cargarCapitulo(idCapitulo) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();

            const { data, error } = await supabaseClient
                .from('capitulos')
                .select('*')
                .eq('id', idCapitulo)
                .maybeSingle();

            if (error || !data) {
                document.getElementById('titulo').innerText = '🏆 Fin de la Aventura';
                document.getElementById('pregunta').innerText = `Has completado la historia.\n\n📊 Tu Resultado Individual:\n⚖️ Reputación: ${jugador.reputacion}% | ⚡ Vitalidad: ${jugador.vitalidad}% | 🎯 Progreso: ${jugador.progreso}%`;
                document.getElementById('btn_a').style.display = 'none';
                document.getElementById('btn_b').style.display = 'none';
                return;
            }

            document.getElementById('titulo').innerText = data.titulo;
            document.getElementById('pregunta').innerText = data.descripcion;
            
            const btnA = document.getElementById('btn_a');
            const btnB = document.getElementById('btn_b');

            btnA.innerText = data.opcion_a_texto;
            btnB.innerText = data.opcion_b_texto;
            btnA.disabled = false;
            btnB.disabled = false;
            btnA.style.display = 'block';
            btnB.style.display = 'block';

            btnA.onclick = () => procesarVoto('A', data.opcion_a_siguiente, data.opcion_a_rep, data.opcion_a_vit, data.opcion_a_prog, data);
            btnB.onclick = () => procesarVoto('B', data.opcion_b_siguiente, data.opcion_b_rep, data.opcion_b_vit, data.opcion_b_prog, data);
        }

        async function procesarVoto(opcionElegida, siguienteId, dRep, dVit, dProg, datosCap) {
            const telegramUser = tg.initDataUnsafe?.user;
            
            document.getElementById('btn_a').disabled = true;
            document.getElementById('btn_b').disabled = true;

            jugador.reputacion = ajustarEscala(jugador.reputacion, dRep);
            jugador.vitalidad = ajustarEscala(jugador.vitalidad, dVit);
            jugador.progreso = ajustarEscala(jugador.progreso, dProg);

            await supabaseClient.from('votos').insert([
                { user_id: telegramUser.id.toString(), capitulo_id: capituloActualId, opcion: opcionElegida }
            ]);

            const { data: todosVotos } = await supabaseClient
                .from('votos')
                .select('opcion')
                .eq('capitulo_id', capituloActualId);

            const total = todosVotos.length;
            const votosA = todosVotos.filter(v => v.opcion === 'A').length;
            const votosB = total - votosA;
            const porcA = total > 0 ? Math.round((votosA / total) * 100) : 0;
            const porcB = total > 0 ? 100 - porcA : 0;

            // Mostrar el porcentaje y los votos entre paréntesis directamente en los botones
            document.getElementById('btn_a').innerHTML = `${datosCap.opcion_a_texto}<br><span style="font-size: 13px; font-weight: normal;">Opción A: ${porcA}% (${votosA} votos)</span>`;
            document.getElementById('btn_b').innerHTML = `${datosCap.opcion_b_texto}<br><span style="font-size: 13px; font-weight: normal;">Opción B: ${porcB}% (${votosB} votos)</span>`;

            await actualizarEstadisticasComunidad();

            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                capituloActualId = siguienteId;
                cargarCapitulo(siguienteId);
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
