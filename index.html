<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrativa Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stats-box {
            background: rgba(0,0,0,0.04);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }
        img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 220px;
            background-color: #eee;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .question {
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-next {
            background-color: #28a745;
            display: none;
        }
        .results-box {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .blocked-card {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Panel de Estado Personal -->
        <div class="stats-box" id="stats-panel">
            <div>⚖️ Reputación: <span id="stat-rep">50</span>% | ⚡ Vitalidad: <span id="stat-vit">100</span>% | 🎯 Progreso: <span id="stat-prog">0</span>%</div>
        </div>

        <img id="imagen" src="https://picsum.photos/400/200?random=1" alt="Escena" referrerpolicy="no-referrer">
        <div id="titulo" class="title">Cargando...</div>
        <div id="pregunta" class="question">Por favor, espera...</div>
        
        <button id="btn_a" class="btn" disabled>Opción A</button>
        <button id="btn_b" class="btn" disabled>Opción B</button>

        <!-- Resultados de la comunidad tras votar -->
        <div id="resultados-comunidad" class="results-box"></div>

        <!-- Botón para avanzar -->
        <button id="btn_next" class="btn btn-next">Siguiente Capítulo ➔</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cnhtbdzzcfvrdkqzrfjf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuaHRiZHp6Y2Z2cmRrcXpyZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDUzMTcsImV4cCI6MjEwNzIyMTMxN30.nBKNHG4ArcWkctm8n-rF592wZ2Aa7MG4fS-qswboWD0';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        const tg = window.Telegram.WebApp;
        tg.expand();

        // Estado local del jugador (Escala 0 a 100)
        let jugador = {
            reputacion: 50,
            vitalidad: 100,
            progreso: 0
        };

        let capituloActualId = 'cap_1'; // Empezamos en el Capítulo 1

        function ajustarEscala(actual, delta) {
            return Math.min(100, Math.max(0, actual + delta));
        }

        function actualizarPanelStats() {
            document.getElementById('stat-rep').innerText = jugador.reputacion;
            document.getElementById('stat-vit').innerText = jugador.vitalidad;
            document.getElementById('stat-prog').innerText = jugador.progreso;
        }

        setTimeout(() => {
            const telegramUser = tg.initDataUnsafe?.user;
            if (!telegramUser || !telegramUser.id) {
                document.getElementById('app').innerHTML = `
                    <div class="blocked-card">
                        <h3>Acceso Restringido</h3>
                        <p>Abre esta Mini App directamente desde Telegram para jugar.</p>
                    </div>
                `;
            } else {
                cargarCapitulo(capituloActualId);
            }
        }, 500);

        async function cargarCapitulo(idCapitulo) {
            document.getElementById('resultados-comunidad').style.display = 'none';
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('imagen').src = 'https://picsum.photos/400/200?random=' + Math.random();

            const { data, error } = await supabaseClient
                .from('capitulos')
                .select('*')
                .eq('id', idCapitulo)
                .maybeSingle();

            if (error || !data) {
                document.getElementById('titulo').innerText = '🏆 Fin de la Aventura';
                document.getElementById('pregunta').innerText = 'Has completado todos los capítulos de la historia.';
                document.getElementById('btn_a').style.display = 'none';
                document.getElementById('btn_b').style.display = 'none';
                mostrarPantallaFinal();
                return;
            }

            document.getElementById('titulo').innerText = data.titulo;
            document.getElementById('pregunta').innerText = data.descripcion;
            
            const btnA = document.getElementById('btn_a');
            const btnB = document.getElementById('btn_b');

            btnA.innerText = data.opcion_a_texto;
            btnB.innerText = data.opcion_b_texto;
            btnA.disabled = false;
            btnB.disabled = false;
            btnA.style.display = 'block';
            btnB.style.display = 'block';

            btnA.onclick = () => procesarVoto('A', data.opcion_a_siguiente, data.opcion_a_rep, data.opcion_a_vit, data.opcion_a_prog);
            btnB.onclick = () => procesarVoto('B', data.opcion_b_siguiente, data.opcion_b_rep, data.opcion_b_vit, data.opcion_b_prog);
        }

        async function procesarVoto(opcionElegida, siguienteId, dRep, dVit, dProg) {
            const telegramUser = tg.initDataUnsafe?.user;
            
            // 1. Desactivar botones
            document.getElementById('btn_a').disabled = true;
            document.getElementById('btn_b').disabled = true;

            // 2. Actualizar variables individuales del jugador
            jugador.reputacion = ajustarEscala(jugador.reputacion, dRep);
            jugador.vitalidad = ajustarEscala(jugador.vitalidad, dVit);
            jugador.progreso = ajustarEscala(jugador.progreso, dProg);
            actualizarPanelStats();

            // 3. Guardar voto en Supabase
            await supabaseClient.from('votos').insert([
                { user_id: telegramUser.id.toString(), capitulo_id: capituloActualId, opcion: opcionElegida }
            ]);

            // 4. Consultar estadísticas comunitarias de este capítulo
            const { data: todosVotos } = await supabaseClient
                .from('votos')
                .select('opcion')
                .eq('capitulo_id', capituloActualId);

            const total = todosVotos.length;
            const votosA = todosVotos.filter(v => v.opcion === 'A').length;
            const votosB = total - votosA;
            const porcA = total > 0 ? Math.round((votosA / total) * 100) : 0;
            const porcB = total > 0 ? 100 - porcA : 0;

            // 5. Mostrar porcentajes en pantalla
            const resBox = document.getElementById('resultados-comunidad');
            resBox.innerHTML = `
                <strong>📊 Estadísticas de la Comunidad (${total} votos totales):</strong><br>
                Opción A: <strong>${porcA}%</strong> (${votosA} votos)<br>
                Opción B: <strong>${porcB}%</strong> (${votosB} votos)
            `;
            resBox.style.display = 'block';

            // 6. Configurar y mostrar botón siguiente
            const btnNext = document.getElementById('btn_next');
            btnNext.style.display = 'block';
            btnNext.onclick = () => {
                capituloActualId = siguienteId;
                cargarCapitulo(siguienteId);
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function mostrarPantallaFinal() {
            document.getElementById('stats-panel').innerHTML = `
                <h3>📊 Tu Resultado Final</h3>
                <p>⚖️ Reputación: <strong>${jugador.reputacion}%</strong> | ⚡ Vitalidad: <strong>${jugador.vitalidad}%</strong> | 🎯 Progreso: <strong>${jugador.progreso}%</strong></p>
            `;
        }
    </script>
</body>
</html>
